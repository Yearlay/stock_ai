<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stock_ai 行情看板</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">我的自选</div>
      <nav id="menu" class="menu"></nav>
      <button id="addSymbolBtn" class="add-symbol">+添加</button>
    </aside>

    <main class="main">
      <header class="toolbar">
        <div class="range">
          <label>开始日期 <input type="date" id="startDate"></label>
          <label>结束日期 <input type="date" id="endDate"></label>
        </div>
        <button id="updateBtn" class="primary">更新</button>
        <div class="periods">
          <button data-period="day" class="period active">日线</button>
          <button data-period="week" class="period">周线</button>
          <button data-period="month" class="period">月线</button>
          <button data-period="year" class="period">年线</button>
        </div>
        <span id="status" class="status"></span>
      </header>

      <div id="chart" class="chart"></div>

      <div class="workspace">
        <section class="detail">
          <div class="detail-head">
            <h1 id="title">请选择标的</h1>
            <span id="meta" class="meta"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead id="thead"></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </section>

        <aside class="grid-panel">
          <div class="grid-buttons">
            <button id="gridSettingsBtn">设置网格</button>
            <button id="gridSimulateBtn">模拟网格</button>
            <button id="gridStatsBtn">模拟统计</button>
          </div>
          <div id="gridContent" class="grid-content">无模拟交易记录</div>
        </aside>
      </div>
    </main>
  </div>

  <div id="progressDialog" class="dialog-overlay" hidden>
    <div class="dialog">
      <h2>正在更新数据</h2>
      <p id="progressText">准备中...</p>
      <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
    </div>
  </div>

  <div id="gridDialog" class="dialog-overlay" hidden>
    <div class="dialog grid-dialog">
      <h2>设置网格</h2>
      <form id="gridForm">
        <label>网格标的 <input id="gridCode" type="text" required></label>
        <label>开始网格日期 <input id="gridStart" type="date" required></label>
        <label>底仓份数 <input id="gridBaseShares" type="number" min="1" value="1000" required></label>
        <label>交割税佣金（元） <input id="gridFee" type="number" min="0" step="0.01" value="5" required></label>
        <label>基准价 <input id="gridBasePrice" type="number" min="0" step="0.0001" required></label>
        <label>网格份额 <input id="gridShare" type="number" min="1" value="100" required></label>
        <label>股价每涨（%）卖出 <input id="gridUpPct" type="number" step="0.01" value="1" required></label>
        <label>股价每跌（%）买入 <input id="gridDownPct" type="number" step="0.01" value="1" required></label>
        <div class="dialog-actions">
          <button type="submit" class="primary">保存</button>
          <button type="button" id="gridCancel">取消</button>
        </div>
      </form>
    </div>
  </div>

  <div id="addDialog" class="dialog-overlay" hidden>
    <div class="dialog">
      <h2>添加标的</h2>
      <form id="addForm">
        <label>标的代码 <input id="addCode" type="text" placeholder="例如 512480" required></label>
        <p id="addError" class="dialog-error"></p>
        <div class="dialog-actions">
          <button type="submit" class="primary">确认</button>
          <button type="button" id="addCancel">取消</button>
        </div>
      </form>
    </div>
  </div>

  <div id="deleteDialog" class="dialog-overlay" hidden>
    <div class="dialog">
      <h2>删除标的</h2>
      <p id="deleteMessage">确认删除该标的的本地缓存吗？</p>
      <div class="dialog-actions">
        <button type="button" id="deleteConfirm" class="danger">确认</button>
        <button type="button" id="deleteCancel">取消</button>
      </div>
    </div>
  </div>

  <script src="/static/echarts.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
